<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Internship | Josh Murzello</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: rgb(15, 11, 11);
            color: white;
            font-family: 'Inter', sans-serif;
        }
        .nav-link {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            color: white;
        }
        .brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 27px;
            color: white;
        }
        .header {
            background: linear-gradient(120deg, rgba(15, 11, 11, 0.92), rgba(15, 11, 11, 0.78));
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            z-index: 1000;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: padding 0.3s ease, box-shadow 0.3s ease;
            overflow: visible;
        }
        .header::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -18px;
            width: 100%;
            height: 18px;
            background: linear-gradient(180deg, rgba(15, 11, 11, 0.6), rgba(15, 11, 11, 0));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .header.scrolled {
            padding: 0.6rem 0;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }
        .header.scrolled::after {
            opacity: 1;
        }
        body {
            padding-top: 90px;
        }
    </style>
</head>
<body>
    <div class="px-3 py-1 header">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start" style="margin-left: 100px;">
                <a href="/" class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none brand">
                    JOSH MURZELLO
                </a>
                <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small">
                    <li>
                        <a href="index.html" class="nav-link">Home</a>
                    </li>
                    <li>
                        <a href="Engineering.html" class="nav-link">Engineering</a>
                    </li>
                    <li>
                        <a href="Creatives.html" class="nav-link">Creatives</a>
                    </li>
                    <li>
                        <a href="about.html" class="nav-link">About</a>
                    </li>
                    <li>
                        <a href="blog.html" class="nav-link">Blog</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <h1 class="display-4 fw-bold" style="font-family: 'Space Grotesk', sans-serif;">Tesla Internship</h1>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const header = document.querySelector('.header');
        if (!header) return;
        const toggleState = () => {
          if (window.scrollY > 50) header.classList.add('scrolled');
          else header.classList.remove('scrolled');
        };
        toggleState();
        window.addEventListener('scroll', toggleState);
      });
    </script>
</body>
</html>
